      <text x="267" y="29" text-anchor="middle" fill="#eff7fb" font-size="18" font-weight="700">MCP client</text>
      <text x="267" y="51" text-anchor="middle" fill="#8ea7b8" font-size="15">absolute command · stdio</text>
    </g>

    <g transform="translate(27 166)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
