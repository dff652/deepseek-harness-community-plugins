          <text x="138" y="25">diff</text>
          <text x="234" y="25">doctor</text>
          <text x="330" y="25">ready</text>
          <text x="42" y="75">migration</text>
          <text x="138" y="75">scan</text>
          <text x="234" y="75">validate</text>
          <text x="330" y="75">version</text>
