name: public-staging-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.19.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run package contract tests
        run: npm test
      - name: Check public repository boundary
        run: npm run check:repo
      - name: Inspect exact package allowlists
        run: |
          npm pack --workspace @dff652/dsh-ai-asset-hub --dry-run --ignore-scripts
          npm pack --workspace @dff652/dsh-agent-mail --dry-run --ignore-scripts
          npm pack --workspace @dff652/dsh-agentmemory --dry-run --ignore-scripts
